<!DOCTYPE html>
<html lang="{{LANG}}">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{LEGAL_TITLE}} — {{DEALER_NAME}}</title>
  <meta name="description" content="{{LEGAL_DESCRIPTION}}" />
  <link rel="canonical" href="{{SITE_URL}}/{{LEGAL_SLUG}}.html" />
  <meta name="theme-color" content="#1C1D20" />
  <meta name="robots" content="index, follow" />
  <link rel="icon" type="image/png" href="{{FAVICON}}" />
  <link rel="apple-touch-icon" href="{{APPLE_TOUCH_ICON}}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  {{STYLES_TAG}}
</head>

<body class="min-h-screen bg-asphalt font-sans text-chalk selection:bg-brand/50">
  <header class="border-b border-white/10">
    <div class="mx-auto flex max-w-3xl items-center justify-between gap-4 px-5 py-4 sm:px-8">
      <a href="/" class="flex items-center" aria-label="{{DEALER_NAME}} home">
        <img src="{{LOGO_SRC}}" alt="{{LOGO_ALT}}" width="190" height="45" class="h-9 w-auto object-contain" />
      </a>
      <a href="/" class="font-display text-lg font-semibold text-steel hover:text-white">← Back to home</a>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-5 py-14 sm:px-8 sm:py-20">
    <div class="steel-rule w-24"></div>
    <h1 class="mt-5 font-display text-5xl font-black uppercase leading-none text-white sm:text-6xl">{{LEGAL_TITLE}}</h1>
    <p class="mt-4 text-sm text-steel">Last updated: {{LEGAL_LAST_UPDATED}}</p>

    <div class="legal mt-10">
      {{LEGAL_BODY}}
    </div>

    <div class="mt-14 rounded-lg border border-white/10 bg-tarmac p-6">
      <h2 class="font-display text-2xl font-bold uppercase text-white">Contact us</h2>
      <address class="mt-3 space-y-1 not-italic text-steel">
        <p class="font-semibold text-chalk">{{DEALER_NAME}}</p>
        <p>{{ADDRESS_LINE1}}<br />{{ADDRESS_LINE2}}</p>
        <p><a href="tel:{{PHONE_TEL}}" class="underline hover:text-white">{{PHONE_DISPLAY}}</a></p>
        <p><a href="mailto:{{EMAIL}}" class="underline hover:text-white">{{EMAIL}}</a></p>
      </address>
    </div>
  </main>

  <footer class="border-t border-white/10">
    <div
      class="mx-auto flex max-w-3xl flex-col items-center justify-between gap-3 px-5 py-8 text-xs text-smoke sm:flex-row sm:px-8">
      <p>© {{YEAR}} {{DEALER_NAME}}. All rights reserved.</p>
      <div class="flex flex-wrap items-center gap-x-4">
        <a href="/privacy-policy.html" class="hover:text-white">Privacy Policy</a>
        <a href="/terms-of-service.html" class="hover:text-white">Terms of Service</a>
        <a href="/sms-disclosure.html" class="hover:text-white">SMS Disclosure</a>
      </div>
    </div>
  </footer>
</body>

</html>
